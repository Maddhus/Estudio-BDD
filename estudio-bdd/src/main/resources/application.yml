spring:
  application:
    name: estudio-bdd
  datasource:
    # Valores padrão são apenas para desenvolvimento local (banco do docker-compose.yml).
    # Em qualquer outro ambiente, sobrescreva por variáveis de ambiente.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/estudio_bdd}
    username: ${DB_USER:estudio}
    password: ${DB_PASSWORD:estudio_dev}
  jpa:
    hibernate:
      # "update" cria/ajusta as tabelas na subida e MANTÉM os dados entre reinicializações.
      ddl-auto: update
    # Decisão didática (ver README, "Decisões de projeto"): o controller converte entidades em DTOs
    # e as associações são LAZY; a sessão aberta durante a requisição evita LazyInitializationException.
    open-in-view: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  cors:
    # Somente a origem da SPA (Vite) pode chamar a API pelo navegador.
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_ENABLED:true}
