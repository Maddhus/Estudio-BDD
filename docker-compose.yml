services:
  postgres:
    image: postgres:16-alpine
    container_name: estudio-bdd-db
    environment:
      POSTGRES_DB: estudio_bdd
      POSTGRES_USER: ${DB_USER:-estudio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-estudio_dev}
    ports:
      - "5432:5432"
    volumes:
      - estudio_bdd_dados:/var/lib/postgresql/data

volumes:
  estudio_bdd_dados:
